<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Admin | Dinesh Yadav</title><link rel="stylesheet" href="style.css"><style>body{background:#071225;color:#eef6ff}.admin{max-width:1200px;margin:0 auto;padding:50px 24px}.admin h1{font-size:42px}.adminbar{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.adminbar input,.adminbar button,.filter{padding:12px 15px;border-radius:10px;border:1px solid #284365;background:#0d1d35;color:#fff}.adminbar button{cursor:pointer}.table-wrap{overflow:auto;border:1px solid #203753;border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:14px;text-align:left;border-bottom:1px solid #1b3049;font-size:13px}.table th{color:#7fa4cb}.badge{padding:5px 9px;border-radius:999px;background:#15375d}.action{padding:7px 9px;border-radius:8px;border:0;cursor:pointer;margin-right:4px}.msg{margin:15px 0;color:#7fc5ff}</style></head><body><div class="admin"><a class="brand" href="/"><span class="brand-mark">DY</span><span>Dinesh Yadav<span class="brand-dot">.</span></span></a><h1>Booking Dashboard</h1><p>USA Job Application Marketing • manage candidate call requests</p><div class="adminbar"><input id="token" type="password" placeholder="Admin token"><select id="filter" class="filter"><option value="">All bookings</option><option>new</option><option>confirmed</option><option>completed</option><option>cancelled</option></select><button onclick="load()">Refresh</button></div><div id="msg" class="msg"></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Time</th><th>Candidate</th><th>Country / Visa</th><th>WhatsApp</th><th>Requirement</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const token=document.getElementById('token'),rows=document.getElementById('rows'),msg=document.getElementById('msg');token.value=sessionStorage.getItem('adminToken')||'';async function load(){const t=token.value.trim();sessionStorage.setItem('adminToken',t);const status=document.getElementById('filter').value;const r=await fetch('/api/admin/bookings?token='+encodeURIComponent(t)+(status?'&status='+status:''));if(!r.ok){msg.textContent='Unauthorized — enter the ADMIN_TOKEN from your server .env';return}const data=await r.json();msg.textContent=data.bookings.length+' booking(s)';rows.innerHTML=data.bookings.map(b=>`<tr><td>${b.booking_date}</td><td>${b.booking_time}</td><td><b>${esc(b.name)}</b><br><small>${esc(b.message||'')}</small></td><td>${esc(b.country)}<br>${esc(b.visa)}</td><td>${esc(b.whatsapp)}</td><td>${esc(b.requirement)}</td><td><span class="badge">${b.status}</span></td><td><button class="action" onclick="setStatus('${b.public_id}','confirmed')">Confirm</button><button class="action" onclick="setStatus('${b.public_id}','completed')">Done</button><button class="action" onclick="setStatus('${b.public_id}','cancelled')">Cancel</button><a class="action" href="/api/bookings/${b.public_id}/ics">ICS</a></td></tr>`).join('')}async function setStatus(id,status){const r=await fetch('/api/admin/bookings/'+id+'?token='+encodeURIComponent(token.value),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(r.ok)load();}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('filter').onchange=load;if(token.value)load();</script></body></html>
